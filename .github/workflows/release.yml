name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - working-directory: android-app
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.2"
          fi
          cp android-app/app/build/outputs/apk/debug/*.apk "DeskFlow-${VERSION}-android.apk"
          cp "DeskFlow-${VERSION}-android.apk" DeskFlow-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: DeskFlow-*.apk }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm binutils
      - name: Build all Linux packages (RPM, DEB, AppImage, TAR.GZ)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.2"
          fi
          chmod +x linux/packaging/build_packages.sh
          ./linux/packaging/build_packages.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/linux/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: microsoft/setup-msbuild@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and Package Windows Installer (.exe & .zip)
        shell: pwsh
        run: |
          $dist = Join-Path (Get-Location) "win\dist"
          $appOut = Join-Path $dist "DeskFlow-win-x64"
          & msbuild win\DeskFlow\DeskFlow.csproj -restore -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishDir=$appOut
          if ($LASTEXITCODE -ne 0) { throw "MSBuild publish failed" }

          # CRITICAL WINUI 3 FIX: Copy generated PRI files to publish directory as resources.pri
          $priFiles = Get-ChildItem -Path "win\DeskFlow" -Recurse -Filter "*DeskFlow.pri"
          foreach ($pri in $priFiles) {
              Copy-Item $pri.FullName (Join-Path $appOut "resources.pri") -Force
              Copy-Item $pri.FullName (Join-Path $appOut "DeskFlow.pri") -Force
              Write-Host "Injected PRI: $($pri.FullName) -> $appOut\resources.pri"
          }
          $allPri = Get-ChildItem -Path "win\DeskFlow" -Recurse -Filter "resources.pri"
          foreach ($p in $allPri) {
              if ($p.DirectoryName -notmatch "Microsoft\.UI\.Xaml") {
                  Copy-Item $p.FullName (Join-Path $appOut "resources.pri") -Force
                  Write-Host "Injected root resources.pri: $($p.FullName)"
              }
          }

          # Bundle native Visual C++ 2015-2022 x64 runtime DLLs for 100% self-contained execution
          $vcDlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "vccorlib140.dll")
          foreach ($dll in $vcDlls) {
              $src = Join-Path "C:\Windows\System32" $dll
              if (Test-Path $src) {
                  Copy-Item $src (Join-Path $appOut $dll) -Force
                  Write-Host "Bundled VC++ runtime DLL: $dll"
              }
          }

          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) { $tag = "1.0.2" }
          $ver = $tag -replace '^v', ''

          Compress-Archive -Path "$appOut\*" -DestinationPath (Join-Path $dist "DeskFlow-$ver-win-x64.zip")

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc "/DMyAppVersion=$ver" win\packaging\DeskFlowInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

          Get-ChildItem -Path $dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            win/dist/*.exe
            win/dist/*.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS Application (DMG, ZIP, Ad-Hoc / Notarized)
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.4"
          fi
          chmod +x macos/scripts/build_macos_dmg.sh
          ./macos/scripts/build_macos_dmg.sh "$VERSION"
      - name: Validate macOS Release Bundle
        run: |
          chmod +x macos/scripts/verify_macos_bundle.sh
          ./macos/scripts/verify_macos_bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip
            macos/dist/SHA256SUMS-macOS.txt
  release:
    needs: [android, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
