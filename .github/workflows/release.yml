name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - working-directory: android-app
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android-app/app/build/outputs/apk/debug/*.apk DeskFlow-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: DeskFlow-android.apk }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm binutils
      - name: Build all Linux packages (RPM, DEB, AppImage, TAR.GZ)
        run: |
          chmod +x linux/packaging/build_packages.sh
          ./linux/packaging/build_packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/linux/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: microsoft/setup-msbuild@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and Package Windows Installer (.exe & .zip)
        shell: pwsh
        run: |
          $dist = Join-Path (Get-Location) "win\dist"
          $appOut = Join-Path $dist "DeskFlow-win-x64"
          & msbuild win\DeskFlow\DeskFlow.csproj -restore -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishDir=$appOut
          if ($LASTEXITCODE -ne 0) { throw "MSBuild publish failed" }

          Compress-Archive -Path "$appOut\*" -DestinationPath (Join-Path $dist "DeskFlow-1.0.0-win-x64.zip")

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc win\packaging\DeskFlowInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

          Get-ChildItem -Path $dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            win/dist/DeskFlow-1.0.0-windows-setup.exe
            win/dist/DeskFlow-1.0.0-win-x64.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS DMG
        run: |
          chmod +x macos/scripts/build_macos_dmg.sh
          ./macos/scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/dist/*.dmg
  release:
    needs: [android, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
